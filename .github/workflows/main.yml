name: turnin test suite

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/main.yml"

env:
  COURSE: hy999
  STUDENT: submitter

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
      - run: sudo make install
      - run: turnin --version
      - name: Create user for course
        run: |
          sudo useradd -m $COURSE
          grep $COURSE /etc/passwd
      - name: Create unprivileged submitter
        run: sudo useradd -m $STUDENT
      - name: Create TURNIN directory for new user
        run: |
          sudo -u $COURSE mkdir -p /home/$COURSE/TURNIN/{ex1,ex2}
      - name: Turn something in
        run: |
          whoami
          yes | turnin ex1@$COURSE src/turnin.c
      - name: Verify turn in
        run: |
          verify-turnin ex1@$COURSE
          sudo -u $COURSE find /home/$COURSE/TURNIN/ex1/
          sudo -u $COURSE find /home/$COURSE/TURNIN/ex1/ | grep `whoami` > /dev/null
      - name: Verify turn in without submission
        run: |
          verify-turnin ex2@$COURSE || test $? -ne 0
      - name: Verify turn in in non existing directory
        run: |
          verify-turnin ex3@$COURSE || test $? -ne 0
      - name: Verify turn in in non existing course
        run: |
          verify-turnin ex1@mycourse || test $? -ne 0
      - name: Reject tar options supplied as submission filenames
        run: |
          set -euo pipefail

          sudo useradd -m tarargcourse
          sudo useradd -m tarargstudent
          sudo install -d -m 0755 \
            /home/tarargcourse/TURNIN/demo/on_time \
            /home/tarargcourse/TURNIN/demo/late
          sudo chown -R tarargcourse:tarargcourse /home/tarargcourse/TURNIN

          sudo -u tarargstudent mkdir -p \
            "/home/tarargstudent/payload/--index-file=/tmp/turnin-regression"
          sudo -u tarargstudent touch \
            /home/tarargstudent/payload/-v \
            "/home/tarargstudent/payload/--index-file=/tmp/turnin-regression/proof" \
            /home/tarargstudent/payload/controlled-content

          # A student cannot create files in this directory.
          sudo install -d -o root -g root -m 0770 /tmp/turnin-regression

          sudo -u tarargstudent sh -c '
            cd /home/tarargstudent/payload
            printf "y\ny\n" |
              /usr/bin/turnin demo@tarargcourse \
                controlled-content \
                -v \
                --index-file=/tmp/turnin-regression/proof
          '

          if test -e /tmp/turnin-regression/proof; then
            echo "tar interpreted a submission filename as an option" >&2
            exit 1
          fi
      - name: Reject files readable only by root group
        run: |
          protected_file=/tmp/turnin-root-group-secret
          printf 'confidential\n' | sudo tee "$protected_file" > /dev/null
          sudo chown root:root "$protected_file"
          sudo chmod 0640 "$protected_file"

          set +e
          yes | sudo -u $STUDENT turnin ex1@$COURSE "$protected_file"
          status=${PIPESTATUS[1]}
          set -e

          test "$status" -ne 0
          ! sudo -u $COURSE find /home/$COURSE/TURNIN/ex1 \
            -type f -name "$STUDENT-*.tgz" -print -quit | grep -q .
      - name: Reject tar options supplied through TAR_OPTIONS
        run: |
          proof=/tmp/turnin-tar-options-proof
          rm -f "$proof"

          sudo -u "$STUDENT" env \
            COURSE="$COURSE" \
            TAR_OPTIONS="--index-file=$proof" \
            sh -c '
              cd "$HOME"
              printf "submission\n" > submission.txt
              printf "y\ny\n" | turnin "ex1@$COURSE" submission.txt
            '
          if test -e "$proof"; then
            echo "tar honored TAR_OPTIONS from the submitter environment" >&2
            exit 1
          fi
